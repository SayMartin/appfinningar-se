name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# En push medan en deploy pågår ska ersätta den, inte tävla med den.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # npm ci installerar exakt det som står i package-lock.json. Bygget på
      # servern får alltså samma versioner som du testat lokalt.
      - run: npm ci

      # Astro skriver färdig HTML till dist/, och optimerar bilderna på vägen.
      - run: npm run build

      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Utan den här raden installerar actionen en gammal wrangler (3.90.0).
          wranglerVersion: '4.125.0'
          command: pages deploy dist --project-name=appfinningar --branch=main
