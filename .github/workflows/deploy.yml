name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# A push during a running deploy should replace it, not race it.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # npm ci installs exactly what package-lock.json says, so the build on
      # the server gets the same versions you tested locally.
      - run: npm ci

      # Astro writes finished HTML to dist/, optimising the images on the way.
      - run: npm run build

      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Without this line the action installs an old wrangler (3.90.0).
          wranglerVersion: '4.125.0'
          command: pages deploy dist --project-name=appfinningar --branch=main
